<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SwiftPY Admin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: #1e293b;
            padding: 2rem 1.5rem;
            border-right: 1px solid #334155;
        }
        .sidebar h2 {
            font-size: 1.25rem;
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 2rem;
        }
        .nav-link {
            display: block;
            color: #94a3b8;
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background: #334155;
            color: #f8fafc;
        }
        .main-content {
            flex: 1;
            padding: 2.5rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .card h3 {
            margin-top: 0;
            font-size: 0.875rem;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .card .value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>SwiftPY Admin</h2>
        <nav>
            <a href="/admin" class="nav-link active">Dashboard</a>
            <a href="/admin/users" class="nav-link">Users</a>
            <a href="/admin/logs" class="nav-link">Logs</a>
            <a href="/admin/settings" class="nav-link">Settings</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="header">
            <h1>System Overview</h1>
        </div>
        <div class="card-grid">
            <div class="card">
                <h3>System Status</h3>
                <div class="value">Operational</div>
            </div>
            <div class="card">
                <h3>Version</h3>
                <div class="value">1.0.0</div>
            </div>
        </div>
    </div>
</body>
</html>
