name: swiftpy

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swiftpy_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: local

      DATABASE_DEFAULT: postgresql

      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: swiftpy
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      DB_POOL_MAX_SIZE: 50

      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - .:/app

  postgres:
    image: postgres:16
    container_name: swiftpy_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: swiftpy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swiftpy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: swiftpy_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: