name: swiftpy

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    container_name: swiftpy_app
    user: "${UID:-1000}:${GID:-1000}"
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      PATH: "/app/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin"

      DATABASE_DEFAULT: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: swiftpy
      DB_USERNAME: postgres
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      DB_POOL_MAX_SIZE: 20

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-secret}"

    volumes:
      - .:/app

  postgres:
    image: postgres:16
    container_name: swiftpy_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: swiftpy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swiftpy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: swiftpy_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secret}"]

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
