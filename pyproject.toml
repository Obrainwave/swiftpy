[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.4",
]

[project]
name = "swiftpy-framework"
version = "0.4.1"
description = "SwiftPY is a new generation async-first Python framework purpose built for the modern API and AI economy."
requires-python = ">=3.12"
dependencies = [
    "uvicorn[standard]>=0.52.4",
    "asyncpg>=0.30.0",
    "cryptography>=50.0.2",
    "bcrypt>=5.0.0",
    "redis>=8.1.0",
    "httpx>=0.27.0",
]
readme = "README.md"
license = "MIT"
authors = [
    { name = "Akeem O. Salau" },
]
keywords = [
    "python",
    "framework",
    "asgi",
    "async",
    "web-framework",
    "orm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.urls]
Homepage = "https://github.com/obrainwave/swiftpy"
Repository = "https://github.com/obrainwave/swiftpy"
Documentation = "https://github.com/obrainwave/swiftpy#readme"
Issues = "https://github.com/obrainwave/swiftpy/issues"

[tool.mypy]
strict = true
exclude = ["examples/"]

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aiosmtplib", "aiosmtplib.*", "jinja2", "jinja2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis.*"]
disallow_untyped_calls = false

[project.scripts]
swiftpy = "swiftpy.console.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swiftpy"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint.per-file-ignores]
"app/models/**/*.py" = ["RUF012"]
"app/**/models/**/*.py" = ["RUF012"]
"tests/**/*.py" = ["RUF012"]
