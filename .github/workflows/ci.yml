name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test, lint, type-check, and package validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swiftpy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      JWT_SECRET: "very-long-and-secure-test-jwt-secret-key-32bytes!"
      AUTH_KEY_PEPPER: "very-long-and-secure-test-auth-pepper-32bytes!"
      DATABASE_DEFAULT: postgresql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: swiftpy
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      DB_POOL_MAX_SIZE: 20
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install SwiftPY development dependencies
        run: uv sync --group dev --frozen || uv sync --group dev

      - name: Run pytest
        run: uv run pytest -vv -ra --durations=30 --timeout=120

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run strict mypy
        run: uv run mypy .

      - name: Build and validate distributions
        run: |
          uv build
          uv run --with twine twine check dist/*
