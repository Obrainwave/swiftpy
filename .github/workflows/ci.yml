name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test, lint, type-check, and package validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: swiftpy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swiftpy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        command: "redis-server --requirepass secret"
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a secret ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      JWT_SECRET: "very-long-and-secure-test-jwt-secret-key-32bytes!"
      AUTH_KEY_PEPPER: "very-long-and-secure-test-auth-pepper-32bytes!"
      DB_CONNECTION: postgresql
      DATABASE_DEFAULT: postgresql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: swiftpy
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      DB_POOL_MAX_SIZE: 20
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install SwiftPY development dependencies
        run: uv sync --group dev --frozen || uv sync --group dev

      - name: Run pytest with coverage gate
        run: COVERAGE_FILE=/tmp/.coverage uv run pytest -vv -ra --durations=30 --timeout=120 --timeout-method=thread --cov=swiftpy --cov-report=term-missing --cov-fail-under=80

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run strict mypy
        run: |
          uv run --no-sync --with jinja2 --with aiosmtplib mypy swiftpy
          uv run mypy swiftpy
          uv run mypy .
          uv run mypy --explicit-package-bases .
          uv run mypy --strict tests/typing/

      - name: Run Pyrefly
        run: |
          uvx pyrefly check --python-interpreter-path .venv/bin/python --error=no-any-return-implicit swiftpy/database/ config/ app/ routes/ database/ main.py tests/typing/

      - name: Dependency security audit
        run: uv run --no-sync --with pip-audit pip-audit --desc on

      - name: Build and validate distributions
        run: |
          uv build
          uv run --with twine twine check dist/*

      - name: Smoke-test built wheel in isolated clean venv
        run: |
          uv venv /tmp/swiftpy-wheel-smoke --python 3.12 --clear
          uv pip install --python /tmp/swiftpy-wheel-smoke/bin/python dist/*.whl
          /tmp/swiftpy-wheel-smoke/bin/swiftpy --help
          (
            cd /tmp && /tmp/swiftpy-wheel-smoke/bin/python -c '
          import asyncio
          import pathlib
          import swiftpy
          import swiftpy.testing
          from swiftpy import Application, Request, json_response
          from swiftpy.ai.client import AI, AIClient
          from swiftpy.ai.embeddings import EmbeddingsClient, generate_deterministic_embedding

          assert hasattr(swiftpy, "ai")
          assert (pathlib.Path(swiftpy.__file__).resolve().parent / "py.typed").is_file()
          app = Application(auto_discover_providers=False)

          @app.get("/smoke")
          async def smoke(req: Request):
              return json_response({"ok": True})

          sent = []
          async def receive():
              return {"type": "http.request", "body": b"", "more_body": False}

          async def send(msg):
              sent.append(msg)

          async def main():
              scope = {
                  "type": "http",
                  "asgi": {"version": "3.0"},
                  "method": "GET",
                  "path": "/smoke",
                  "raw_path": b"/smoke",
                  "query_string": b"",
                  "headers": [],
              }
              await app(scope, receive, send)
              assert sent[0]["status"] == 200
              fake = AI.fake("smoke-ok")
              resp = await AI.chat().user("hello").send()
              assert resp.content == "smoke-ok"
              fake.restore()
              vec = generate_deterministic_embedding("hello", dimensions=8)
              assert len(vec) == 8

          asyncio.run(main())
          '
                    )
          /tmp/swiftpy-wheel-smoke/bin/python -c '
          import pathlib, signal, socket, subprocess, tempfile, time, urllib.request
          with tempfile.TemporaryDirectory() as d:
              proj = pathlib.Path(d) / "smoke_app"
              proj.mkdir()
              (proj / "main.py").write_text(
                  "from swiftpy import Application, Request, json_response\n"
                  "app = Application(auto_discover_providers=False)\n"
                  "@app.get(\"/smoke\")\n"
                  "async def smoke(req: Request):\n"
                  "    return json_response({\"ok\": True})\n",
                  encoding="utf-8",
              )
              with socket.socket() as s:
                  s.bind(("127.0.0.1", 0))
                  port = s.getsockname()[1]
              proc = subprocess.Popen(
                  ["/tmp/swiftpy-wheel-smoke/bin/swiftpy", "start", "--host", "127.0.0.1", "--port", str(port), "--reload"],
                  cwd=proj,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              ok = False
              try:
                  deadline = time.monotonic() + 10.0
                  while time.monotonic() < deadline and proc.poll() is None:
                      try:
                          with urllib.request.urlopen(f"http://127.0.0.1:{port}/smoke", timeout=0.5) as resp:
                              if resp.status == 200:
                                  ok = True
                                  break
                      except Exception:
                          time.sleep(0.1)
              finally:
                  if proc.poll() is None:
                      proc.send_signal(signal.SIGINT)
                      try:
                          out, _ = proc.communicate(timeout=5)
                      except subprocess.TimeoutExpired:
                          proc.kill()
                          out, _ = proc.communicate(timeout=5)
                  else:
                      out, _ = proc.communicate(timeout=5)
              assert ok, out
          '
          rm -rf /tmp/swiftpy-pyrefly-smoke && mkdir -p /tmp/swiftpy-pyrefly-smoke
          (
            cd /tmp/swiftpy-pyrefly-smoke
            /tmp/swiftpy-wheel-smoke/bin/swiftpy new ci_smoke_api
            cd ci_smoke_api
            cat <<'EOF' > v041_typing_contract_smoke.py
          from __future__ import annotations

          from typing import assert_type

          from swiftpy import Auth, AuthProxy, AuthUser, Request, UniqueRule, ValidatedData, unique
          from swiftpy.auth import auth
          from swiftpy.auth_manager import Auth as LegacyAuth
          from swiftpy.auth_manager import auth as legacy_auth


          def check_auth_contracts() -> AuthUser:
              _proxy = assert_type(auth(), AuthProxy)
              _user = assert_type(auth().user(), AuthUser)
              _uid = auth().user().id
              _facade_id = Auth.user().id
              _legacy_id = legacy_auth().user().id
              _legacy_facade_id = LegacyAuth.user().id
              _nullable = assert_type(auth().user(nullable=True), AuthUser | None)
              _facade_nullable = assert_type(Auth.user(nullable=True), AuthUser | None)
              _strict = assert_type(auth().user_or_fail(), AuthUser)
              _ = (_proxy, _user, _uid, _facade_id, _legacy_id, _legacy_facade_id, _nullable, _facade_nullable, _strict)
              return auth().user()


          async def check_validation_contracts(request: Request, user_id: int) -> ValidatedData:
              _rule = assert_type(unique("users", "email").ignore(user_id), UniqueRule)
              _ = _rule
              return assert_type(
                  await request.validate({"email": f"required|email|unique:users,email,{user_id}"}),
                  ValidatedData,
              )
          EOF
            uvx pyrefly check --python-interpreter-path /tmp/swiftpy-wheel-smoke/bin/python --error=no-any-return-implicit app/ config/ routes/ database/ prompts/ main.py v041_typing_contract_smoke.py
            uv run --python /tmp/swiftpy-wheel-smoke/bin/python --with mypy mypy --strict v041_typing_contract_smoke.py
          )
          rm -rf /tmp/swiftpy-pyrefly-smoke /tmp/swiftpy-wheel-smoke
